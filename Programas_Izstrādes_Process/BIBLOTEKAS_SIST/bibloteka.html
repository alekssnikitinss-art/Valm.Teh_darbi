<!doctype html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bibliotēka</title>
    <link rel="stylesheet" href="style/bibloteka.css">
</head>
<body>
    <header>
        <h1>Vienkārša Bibliotēkas Sistēma</h1>
        <div id="login-area">
            <input id="username" placeholder="lietotājvārds">
            <input id="password" type="password" placeholder="parole">
            <button id="btn-login">Ienākt</button>
            <span id="login-status"></span>
        </div>
    </header>

    <main>
        <section id="books-section">
            <h2>Grāmatas</h2>
            <div id="books-list">Ielādē...</div>
        </section>

        <section id="admin-section" class="hidden">
            <h2>Admin panelis</h2>
            <div>
                <input id="new-title" placeholder="Nosaukums">
                <input id="new-author" placeholder="Autors">
                <input id="new-isbn" placeholder="ISBN">
                <button id="btn-add-book">Pievienot grāmatu</button>
            </div>
            <h3>Rezervācijas</h3>
            <div id="admin-reservations">N/A</div>
        </section>
    </main>

    <footer>
        <small>Admin lietotājs: <code>admin</code> / <code>admin123</code></small>
    </footer>

    <script src="func/bibloteka.js"></script>
</body>
</html>
