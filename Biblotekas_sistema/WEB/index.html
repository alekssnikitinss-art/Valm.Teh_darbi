<html lang="en">
<head>
   
    <meta charset="UTF-8">
   
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Bibloteka</title>
   
    <link rel="stylesheet" href="style.css">
</head>


<body>

    <h1 id="bib_name"> Bibloteka</h1>

    <section id="controls">
        <h2>Pievienot grāmatu</h2>
        <label>Nosaukums: <input id="title" /></label><br>
        <label>Autors: <input id="author" /></label><br>
        <label>ISBN: <input id="isbn" /></label><br>
        <button id="addBtn">Pievienot</button>

        <h2>Meklēšana</h2>
        <label>Meklēt pēc nosaukuma/autora: <input id="q" /></label>
        <button id="searchBtn">Meklēt</button>
        <button id="listBtn">Rādīt visu</button>
    </section>

    <section id="results">
        <h2>Grāmatu saraksts</h2>
        <ul id="books"></ul>
    </section>

</body>


<script src="func/functional.js"></script>
</html>
